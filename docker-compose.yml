# TippyMe local infrastructure (Phase 3+)
services:
  postgres:
    image: postgres:16-alpine
    container_name: cheer-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: cheer
      POSTGRES_PASSWORD: cheer
      POSTGRES_DB: cheer
    volumes:
      - cheer_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cheer -d cheer']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cheer_pg_data:
