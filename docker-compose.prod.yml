# Example production stack — fill secrets via host env / secret manager.
# Do NOT commit real .env.production files.
#
# Recommended topology (same public origin for cookies):
#   https://<domain>/        → web:3000
#   https://<domain>/api/*   → api:3001  (edge reverse proxy OR Nuxt Nitro proxy)
#
# OutRay is NOT used in production. Point Bachs webhooks at:
#   https://<api-public-host>/api/webhooks/bachs
#
# Usage (after setting env):
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api npx prisma migrate deploy

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: api
      LOG_FORMAT: json
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      OTP_HASH_PEPPER: ${OTP_HASH_PEPPER}
      BACHS_API_KEY: ${BACHS_API_KEY}
      BACHS_API_BASE_URL: ${BACHS_API_BASE_URL:-https://api.bachs.io}
      BACHS_WEBHOOK_SECRET: ${BACHS_WEBHOOK_SECRET}
      SENDBYTE_API_KEY: ${SENDBYTE_API_KEY}
      SENDBYTE_FROM_EMAIL: ${SENDBYTE_FROM_EMAIL}
      SENDBYTE_WEBHOOK_SECRET: ${SENDBYTE_WEBHOOK_SECRET:-}
      ERROR_MONITORING_DSN: ${ERROR_MONITORING_DSN:-}
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NUXT_PUBLIC_APP_URL: ${APP_URL}
        NUXT_PUBLIC_API_URL: ''
        API_INTERNAL_URL: http://api:3001
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_APP_URL: ${APP_URL}
      NUXT_PUBLIC_API_URL: ''
      API_INTERNAL_URL: http://api:3001
      NUXT_PUBLIC_API_PROXY_TARGET: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

# Managed Postgres is recommended in production (Neon, RDS, etc.).
# If you self-host Postgres, add a postgres service and wire DATABASE_URL.
