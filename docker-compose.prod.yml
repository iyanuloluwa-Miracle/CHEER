# Example production stack — fill secrets via host env / secret manager.
# Do NOT commit real .env.production files.
#
# Topology (single Nuxt/Nitro process):
#   https://<domain>/        → web:3000 (SSR pages)
#   https://<domain>/api/*   → same process (Nitro handlers)
#
# OutRay is NOT used in production. Point Bachs webhooks at:
#   https://<domain>/api/webhooks/bachs
#
# Usage (after setting env):
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec web npx prisma migrate deploy

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_APP_URL: ${APP_URL}
        NUXT_PUBLIC_API_URL: ''
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_APP_URL: ${APP_URL}
      NUXT_PUBLIC_API_URL: ''
      APP_URL: ${APP_URL}
      API_URL: ${API_URL:-${APP_URL}}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-${DATABASE_URL}}
      AUTH_SECRET: ${AUTH_SECRET}
      OTP_HASH_PEPPER: ${OTP_HASH_PEPPER}
      BACHS_API_KEY: ${BACHS_API_KEY}
      BACHS_API_BASE_URL: ${BACHS_API_BASE_URL:-https://api.bachs.io}
      BACHS_WEBHOOK_SECRET: ${BACHS_WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      ERROR_MONITORING_DSN: ${ERROR_MONITORING_DSN:-}
      LOG_FORMAT: json
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 25s

# Managed Postgres is recommended in production (Neon, RDS, etc.).
# If you self-host Postgres, add a postgres service and wire DATABASE_URL.
